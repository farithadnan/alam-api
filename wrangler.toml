# Alam — Cloudflare Worker + static assets + D1
#
# Two modes, one config:
#   DEV  -> npx wrangler dev            (serves the SPA + Worker locally; D1 = a LOCAL
#     sqlite under .wrangler/, fed by the migrations — zero cloud state)
#   PROD -> npx wrangler deploy         (serves the SPA + Worker at the Worker's zone/
#     custom domain (app.oh-alam.my at cutover); D1 = the remote `alam` DB bound below)
#
# Docs for the dev/prod workflow live in README.md ("Local development" / "Deploy").
name = "alam"
main = "src/worker.js"
compatibility_date = "2026-09-14"

[[d1_databases]]
binding = "DB"
database_name = "alam"
database_id = "f23e188f-0e5d-44ac-a1d3-6a45aa5c747b"
migrations_dir = "migrations"

[assets]
directory = "../udara-dashboard/dist"
# Serve assets THROUGH the Worker so we can set cache headers per file: index.html is
# always revalidated (no-cache) so the browser never holds an HTML that references a
# pruned bundle (→ 404 until hard refresh), while hashed /assets/* bundles are immutable.
# run_worker_first routes every request to the Worker; serveAssets() falls back to the
# SPA (index.html) for paths with no matching file. /api/* and /health never touch assets.
binding = "ASSETS"
run_worker_first = true
