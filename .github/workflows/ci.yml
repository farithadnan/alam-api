name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs Node 22.5+; 24 matches the dev machine
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Test
        # Pin the timezone: freshness/age logic must not depend on the host timezone,
        # and this makes local and CI agree instead of the suite passing on UTC+8 only.
        env:
          TZ: UTC
        run: npm test
